<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="HUFS Global CORE 콘텐츠 관리"><title>콘텐츠 관리 | HUFS Global CORE</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/admin/admin.css"><script type="module" src="/admin/app.bundle.js"></script></head>
<body><header class="admin-header"><a href="/">HUFS Global CORE</a><span>콘텐츠 관리</span><button id="logout" hidden>로그아웃</button></header><main class="admin-main"><h1>센터 콘텐츠 관리</h1><p class="intro">연구진과 센터 소식을 직접 관리하세요. 미리보기를 확인한 뒤 게시할 수 있습니다.</p><p id="status" role="status" aria-live="polite"></p>
<section id="login-panel"><h2>관리자 로그인</h2><p>초대받은 이메일 계정으로 로그인해 주세요.</p><form id="login-form"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">로그인</button><button type="button" id="recover">비밀번호 재설정 메일 받기</button></form></section>
<section id="password-panel" hidden><h2>비밀번호 설정</h2><form id="password-form"><label>새 비밀번호<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>비밀번호 확인<input name="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button class="primary">비밀번호 저장</button></form></section>
<section id="workspace" hidden><nav class="admin-tabs" aria-label="관리할 콘텐츠"><button data-collection="members" aria-pressed="true">연구진</button><button data-collection="notices" aria-pressed="false">공지사항</button><button data-collection="gallery" aria-pressed="false">갤러리</button></nav><div class="toolbar"><h2 id="collection-title">연구진</h2><button id="refresh">목록 새로고침</button><button class="primary" id="new">새 항목 추가</button></div><div class="admin-layout"><div id="entries" class="entries"></div><section id="editor-panel"><p id="editor-hint">항목을 선택하거나 새 항목을 추가하세요.</p><form id="editor" hidden><div id="fields"></div><div class="editor-actions"><button class="primary" type="submit">게시 전 미리보기</button><button id="cancel" type="button">편집 닫기</button></div></form></section></div></section>
</main><dialog id="preview"><div class="preview-header"><h2>게시 전 확인</h2><button id="close-preview" aria-label="미리보기 닫기">닫기</button></div><div id="preview-content"></div><p class="preview-note">게시하면 사이트에 반영됩니다. 배포까지 잠시 걸릴 수 있습니다.</p><button id="publish" class="primary">이 내용으로 게시</button></dialog></body></html>
